
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp072-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mp072-api
  template:
    metadata:
      labels:
        app: mp072-api
    spec:
      containers:
        - name: mp072-api
          image: mp072-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
