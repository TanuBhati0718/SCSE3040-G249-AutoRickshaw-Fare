
data:
  train_path: data/raw/train.csv
  later_path: data/raw/later.csv
  holdout_path: data/raw/holdout_features.csv
  target: fare_rs
  test_size: 0.20
  random_state: 42

preprocessing:
  drop_columns:
    - record_id
    - date
    - fare_paid_receipt_rs
  sentinel_distance: 9999
  remove_duplicates: true
  target_typo_threshold: 1000
  target_typo_factor: 10

model:
  algorithm: RandomForestRegressor
  n_estimators: 200
  max_depth: 12
  min_samples_split: 2
  random_state: 42

tracking:
  experiment_name: MP072_AutoRickshaw_Fare
  registered_model_name: MP072_AutoRickshaw_Fare_Model

monitoring:
  psi_bins: 10
  promotion_threshold: 0.12
  later_train_fraction: 0.70
